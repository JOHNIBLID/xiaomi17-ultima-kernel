name: Build Xiaomi 17 ReSukiSU Ultima Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel Image & AnyKernel3
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libncurses5-dev libssl-dev lzop \
            python3 python-is-python3 rsync zip zlib1g-dev llvm lld dwarves wget tar \
            libdw-dev libdwarf-dev
            
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Detect Kernel Directory Structure
        run: |
          if [ -d "$GITHUB_WORKSPACE/android_kernel_xiaomi_sm8850-Mi17_Kernel-ReSuki-susfs-20260810-1019" ]; then
            echo "KERNEL_ROOT=$GITHUB_WORKSPACE/android_kernel_xiaomi_sm8850-Mi17_Kernel-ReSuki-susfs-20260810-1019" >> $GITHUB_ENV
          else
            echo "KERNEL_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          fi

      - name: Setup AOSP Clang Toolchain (Clang 19)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xzf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz

      - name: Fetch and Integrate ReSukiSU Ultima Source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/spacealtctrl/ReSukiSU-Ultima.git -b main resukisu_src
          
          mkdir -p ${{ env.KERNEL_ROOT }}/drivers/resukisu
          cp -rf resukisu_src/kernel/* ${{ env.KERNEL_ROOT }}/drivers/resukisu/
          
          rm -rf ${{ env.KERNEL_ROOT }}/drivers/resukisu/include/uapi
          mkdir -p ${{ env.KERNEL_ROOT }}/drivers/resukisu/include/uapi
          cp -rf resukisu_src/uapi/* ${{ env.KERNEL_ROOT }}/drivers/resukisu/include/uapi/
          
          mkdir -p ${{ env.KERNEL_ROOT }}/include/uapi/linux
          cp -rf resukisu_src/uapi/* ${{ env.KERNEL_ROOT }}/include/uapi/linux/ 2>/dev/null || true
          
          rm -rf resukisu_src

      - name: Enforce Ultima v4.1.0 Configuration
        run: |
          cd ${{ env.KERNEL_ROOT }}
          chmod -R +x scripts/
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          bash scripts/config --file $DEFCONFIG \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KPM \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            --set-str KSU_FULL_NAME_FORMAT "me.ezio.resukis"

      - name: Compile Xiaomi 17 Kernel
        run: |
          cd ${{ env.KERNEL_ROOT }}
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="JOHNBLID"
          export KBUILD_BUILD_HOST="GitHubActions"
          
          # ضبط الإعدادات وتثبيت الافتراضيات آلياً دون توقف
          make O=out ARCH=arm64 gki_defconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          
          # تجهيز ملفات الربط والـ VDSO أولاً لتفادي خطأ vdso.lds
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 prepare
          
          # التجميع النهائي لملف الـ Image
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Package with AnyKernel3 (Xiaomi 17 Pudding)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          sed -i 's/do.device.check=1/do.device.check=0/g' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel.sh
          sed -i 's|block=/dev/block/bootdevice/by-name/boot|block=auto|g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=pudding/g' anykernel.sh
          
          cp ${{ env.KERNEL_ROOT }}/out/arch/arm64/boot/Image .
          zip -r9 $GITHUB_WORKSPACE/Xiaomi17_ReSukiSU_Ultima_v4.1.0.zip * -x .git README.md *placeholder

      - name: Upload AnyKernel3 Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi17-ReSukiSU-Ultima-Kernel
          path: Xiaomi17_ReSukiSU_Ultima_v4.1.0.zip
          retention-days: 7

      - name: Upload Raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-arm64
          path: ${{ env.KERNEL_ROOT }}/out/arch/arm64/boot/Image
          retention-days: 7
